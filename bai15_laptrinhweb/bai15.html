<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 15 - Máy tính đơn giản (JavaScript)</title>
    <link rel="stylesheet" href="stylebai15.css">
</head>

<body>

    <div class="maytinh">
        <div class="manhinh">
            <div id="nhappheptinh" class="nhappheptinh"></div>
            <div id="ketqua" class="ketqua">0</div>
        </div>
        <div class="banphim">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendCharacter('()')">()</button>
            <button class="operator" onclick="appendCharacter('*1/100')">%</button>
            <button class="operator" onclick="appendCharacter('/')">÷</button>

            <button onclick="appendCharacter('7')">7</button>
            <button onclick="appendCharacter('8')">8</button>
            <button onclick="appendCharacter('9')">9</button>
            <button class="operator" onclick="appendCharacter('*')">×</button>

            <button onclick="appendCharacter('4')">4</button>
            <button onclick="appendCharacter('5')">5</button>
            <button onclick="appendCharacter('6')">6</button>
            <button class="operator" onclick="appendCharacter('-')">-</button>

            <button onclick="appendCharacter('1')">1</button>
            <button onclick="appendCharacter('2')">2</button>
            <button onclick="appendCharacter('3')">3</button>
            <button class="operator" onclick="appendCharacter('+')">+</button>

            <button class="so0" onclick="appendCharacter('0')">0</button>
            <button onclick="appendCharacter('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script src="bai15.js"></script>
</body>

</html>
